[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "retail-sales-lakehouse-migration"
version = "0.1.0"
description = "Medallion-architecture data lakehouse migration from legacy SSIS/SSAS pipeline"
requires-python = ">=3.11"
dependencies = [
    # Orchestration
    "apache-airflow==2.9.3",
    # dbt transformation engine
    "dbt-core==1.8.7",
    "dbt-postgres==1.8.2",
    # Property-based testing
    "hypothesis==6.112.2",
    # Test runner
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    # SQL linting
    "sqlfluff==3.2.5",
    # Object storage clients
    "boto3==1.35.36",
    "minio==7.2.9",
    # Utilities
    "tenacity==9.0.0",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "hypothesis==6.112.2",
    "sqlfluff==3.2.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests that require the full Docker Compose stack",
    "slow: marks tests that take a long time to run",
]

[tool.sqlfluff.core]
dialect = "postgres"
templater = "dbt"
sql_file_exts = ".sql"

[tool.sqlfluff.templater.dbt]
project_dir = "dbt"

[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "upper"

[tool.sqlfluff.rules.capitalisation.identifiers]
capitalisation_policy = "lower"
